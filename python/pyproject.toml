[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-cumulative-ad-line"
version = "0.1.0"
description = "Causal, revision-aware Cumulative Advance/Decline Line with correction-propagation analysis."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Fintech Builder" }]
keywords = ["fintech", "cumulative-advance-decline-line", "market-breadth", "advance-decline", "point-in-time", "event-sourcing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Article = "https://thefintechbuilder.com/market-breadth-and-internals/advance-decline-breadth/cumulative-advance-decline-line/"
Homepage = "https://github.com/IslamBaraka90/Fintech-Cumulative-Advance-Decline-Line-Market-Breadth-algorithm"
Index = "https://github.com/IslamBaraka90/Fintech-Algorithms-Awesome"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
